<!DOCTYPE html>
<html>
<head>
  <title>Human Verification</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .captcha {
      width: 300px;
      background: white;
      border: 1px solid #d6d6d6;
      border-radius: 3px;
      padding: 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    .title {
      font-size: 14px;
      color: #555;
      margin-bottom: 15px;
    }

    .check-area {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .checkbox {
      width: 28px;
      height: 28px;
      border: 2px solid #777;
      border-radius: 3px;
      margin-right: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .checkbox.checked {
      background: #4285f4;
      border-color: #4285f4;
    }

    .checkmark {
      display: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    .checked .checkmark {
      display: block;
    }

    .label {
      font-size: 16px;
      color: #333;
    }

    .branding {
      margin-top: 16px;
      text-align: right;
      font-size: 10px;
      color: #777;
    }

    #success {
      display: none;
      margin-top: 15px;
      color: #188038;
    }

    #returnButton {
      display: none;
      margin-top: 15px;
      padding: 9px 16px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="captcha">

  <div class="title">Human verification</div>

  <div class="check-area" onclick="verify()">
    <div class="checkbox" id="box">
      <span class="checkmark">✓</span>
    </div>

    <div class="label">I'm not a robot</div>
  </div>

  <div class="branding">
    CAPTCHA-style demo<br>
    <small>Safety check Recaptcha test</small>
  </div>

  <div id="success">
    ✓ Verification complete
  </div>

  <button id="returnButton" onclick="history.back()">
    Return to email
  </button>

</div>

<script>
function verify() {
  document.getElementById("box").classList.add("checked");
  document.getElementById("success").style.display = "block";
  document.getElementById("returnButton").style.display = "inline-block";
}
</script>

</body>
</html>
